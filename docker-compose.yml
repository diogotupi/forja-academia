services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liderflix
      POSTGRES_USER: liderflix
      POSTGRES_PASSWORD: liderflix_dev
    ports:
      - "5432:5432"
    volumes:
      - liderflix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liderflix"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  liderflix_pg:
